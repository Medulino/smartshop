services:
  web:
    build: .
    container_name: compra_web
    restart: always
    env_file:
      - .env
    # Red del host: el contenedor sale a internet con el mismo enrutado que
    # el host (imprescindible aquí: la VPN de NordVPN en modo split-tunnel
    # no se aplica al tráfico de los contenedores en red bridge, y sin ella
    # Gemini/OpenRouter cortan la conexión TLS). El puerto lo fija gunicorn
    # en el Dockerfile (8010). La BD del host se alcanza por 127.0.0.1.
    network_mode: host
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
      - logs_data:/app/logs
    # Límites de recursos para que un worker atascado no consuma el host
    mem_limit: 1g
    cpus: 2
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/salud/', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  backup:
    image: postgres:17
    container_name: compra_backup
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - ./backups:/backups
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: >
      sh -c "while true; do
        umask 077;
        f=/backups/backup_$$(date +%Y%m%d_%H%M%S).sql;
        pg_dump -h host.docker.internal -p ${DB_PORT} -U ${DB_USER} ${DB_NAME} > \"$$f\" && test -s \"$$f\" && echo \"Backup OK: $$f\" || { echo \"Backup FALLIDO: $$f\"; rm -f \"$$f\"; };
        find /backups -name 'backup_*.sql' -mtime +30 -delete;
        docker exec compra_web python manage.py limpiar_intentos || echo 'limpiar_intentos fallido';
        docker exec compra_web python manage.py clearsessions || echo 'clearsessions fallido';
        docker exec compra_web python manage.py purgar_inactivos --dias 7 || echo 'purgar_inactivos fallido';
        sleep 86400;
      done"

volumes:
  static_files:
  media_files:
  logs_data: